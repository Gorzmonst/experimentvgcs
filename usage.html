<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用率分布</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    #list li { margin: 8px 0; }
    .sns-area { margin-top: 30px; border: 1px solid #ddd; padding: 15px; background: #fafafa; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    #adjustModeBtn.active { background: #e74c3c; color: white; }
    #adjustHint { color: #666; font-size: 0.9em; display: none; }
    #pieChart { touch-action: none; }
    #snsCanvas { width: 100%; height: auto; display: block; border: 1px solid #ccc; background: #10162b; }
  </style>
</head>
<body>
  <p><a href="index.html">← トップへ戻る</a></p>
  <h1>デッキ使用率分布</h1>

  <p>
    トナメルCSV：<input type="file" id="csvFile" accept=".csv">
    デッキ名カラム：<input type="text" id="deckColumn" value="使用されるデッキのG3" style="width:200px">
    <button onclick="processCSV()">集計</button>
  </p>

  <p id="rideStatus">ライドラインマッピング読み込み中...</p>

  <p>
    <button id="adjustModeBtn" onclick="toggleAdjustMode()">画像調整モード: OFF</button>
    <button onclick="resetOffsets()">画像位置をリセット</button>
  </p>
  <p id="adjustHint">調整モード中：画像をドラッグ（スマホはタップしたまま移動）して位置を調整できます。SNS用画像にも反映されます</p>

  <div id="list"></div>
  <canvas id="pieChart" style="max-width:700px; margin:20px auto; display:block;"></canvas>

  <div class="sns-area">
    <h2>SNS投稿用画像（1920×1080）</h2>
    <p>
      大会名（任意）：<input type="text" id="eventName" style="width:260px" oninput="renderSnsCanvas()">
      リスト表示数：<input type="number" id="snsTop" value="10" min="3" max="12" style="width:60px" oninput="renderSnsCanvas()">
    </p>
    <canvas id="snsCanvas" width="1920" height="1080"></canvas>
    <button onclick="downloadSNSImage()">SNS用画像をダウンロード</button>
  </div>

  <script>
    let rideMap = {};
    let chart = null;
    let sortedData = [];
    let totalCount = 0;
    let imageOffsets = [];
    let adjustMode = false;
    let dragging = null;
    let imgElements = [];

    const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif';
    const snsImgCache = {}; // url -> { img, ok }

    // HTMLエスケープ（CSVの文字列をinnerHTMLに入れるため）
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // デッキ名の表記ゆれを吸収（全角半角・引用符・空白）
    function normKey(s) {
      return String(s || '')
        .normalize('NFKC')
        .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
        .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
        .replace(/\s+/g, '');
    }

    function getCardImageUrl(cardNo) {
      if (!cardNo) return null;
      const parts = cardNo.split('/');
      if (parts.length < 2) return null;
      const set = parts[0].trim();
      let num = parts[1].trim();
      if (!set || !num) return null;
      if (/^\d+$/.test(num)) num = num.padStart(3, '0');
      const setLower = set.toLowerCase().replace(/-/g, '');
      return `https://cf-vanguard.com/wordpress/wp-content/images/cardlist/${set}/${setLower}_${num}.png`;
    }

    function loadRideLines() {
      fetch('./ridelines.csv')
        .then(r => {
          if (!r.ok) throw new Error();
          return r.text();
        })
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
              buildRideMap(res.data);
              document.getElementById('rideStatus').textContent =
                `ライドラインマッピング読み込み完了（${res.data.length}件）`;
            }
          });
        })
        .catch(() => {
          document.getElementById('rideStatus').textContent = 'ridelines.csv の読み込みに失敗しました';
        });
    }

    function buildRideMap(data) {
      rideMap = {};
      data.forEach(row => {
        const abbr = (row['略称'] || '').trim();
        const full = (row['正式名称'] || '').trim();
        const cardNo = (row['カード番号'] || '').trim();
        if (!abbr && !full) return;
        const img = getCardImageUrl(cardNo); // 番号が空なら null
        const entry = { 正式名称: full, カード番号: cardNo, 画像URL: img };
        if (abbr) rideMap[normKey(abbr)] = entry;
        if (full) rideMap[normKey(full)] = entry;
      });
    }

    function getRideInfo(deckName) {
      return rideMap[normKey(deckName)] || null;
    }

    function toggleAdjustMode() {
      adjustMode = !adjustMode;
      const btn = document.getElementById('adjustModeBtn');
      const hint = document.getElementById('adjustHint');
      btn.textContent = `画像調整モード: ${adjustMode ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', adjustMode);
      hint.style.display = adjustMode ? 'block' : 'none';
      if (chart) {
        chart.options.plugins.tooltip.enabled = !adjustMode;
        chart.update();
      }
    }

    function resetOffsets() {
      imageOffsets = imageOffsets.map(() => ({ dx: 0, dy: 0 }));
      if (chart) chart.update('none');
    }

    function processCSV() {
      const file = document.getElementById('csvFile').files[0];
      const columnName = document.getElementById('deckColumn').value.trim();
      if (!file) return alert('CSVを選択してください');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const counts = {};
          let total = 0;
          results.data.forEach(row => {
            // トナメルCSVの「エントリーキャンセル」は集計から除外
            if ((row['ステータス'] || '').includes('キャンセル')) return;
            const deck = (row[columnName] || '').trim();
            if (deck) {
              counts[deck] = (counts[deck] || 0) + 1;
              total++;
            }
          });
          if (!total) return alert('データが見つかりません。カラム名を確認してください');

          totalCount = total;

          // 使用率の高い順にソート
          sortedData = Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => ({
              name,
              count,
              percent: (count / total * 100).toFixed(1)
            }));

          // 箇条書き（高い順）
          document.getElementById('list').innerHTML =
            `<h2>使用率上位（全${total}人）</h2><ul>` +
            sortedData.map(d => `<li><strong>${esc(d.name)}</strong>：${d.count}人（${d.percent}%）</li>`).join('') +
            '</ul>';

          imageOffsets = sortedData.map(() => ({ dx: 0, dy: 0 }));
          createPieChart();
        }
      });
    }

    function createPieChart() {
      if (chart) chart.destroy();

      const labels = sortedData.map(d => d.name);
      const values = sortedData.map(d => d.count);
      const colors = labels.map((_, i) => `hsl(${i * 360 / labels.length}, 70%, 55%)`);

      // この円グラフのcanvasは画像として書き出さないので crossOrigin は付けない
      // （付けると公式側がCORS非対応の場合に読み込み自体が失敗するため）
      imgElements = sortedData.map(d => {
        const info = getRideInfo(d.name);
        if (!info || !info.画像URL) return null;
        const img = new Image();
        img.onload = () => { if (chart) chart.update('none'); };
        img.src = info.画像URL;
        return img;
      });

      const ctx = document.getElementById('pieChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors
          }]
        },
        options: {
          responsive: true,
          animation: false,
          plugins: {
            legend: { position: 'right' },
            tooltip: { enabled: !adjustMode }
          }
        },
        plugins: [{
          id: 'imageDrawer',
          afterDatasetsDraw(c) {
            const cx = c.ctx;
            const meta = c.getDatasetMeta(0);

            meta.data.forEach((arc, i) => {
              const img = imgElements[i];
              // 読み込み未完了・失敗（naturalWidth 0）の画像はスキップ
              if (!img || !img.complete || img.naturalWidth === 0) return;

              const midAngle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;
              const radius = (arc.outerRadius + arc.innerRadius) / 2 * 0.65;
              const centerX = c.chartArea.left + (c.chartArea.right - c.chartArea.left) / 2;
              const centerY = c.chartArea.top + (c.chartArea.bottom - c.chartArea.top) / 2;

              let x = centerX + Math.cos(midAngle) * radius;
              let y = centerY + Math.sin(midAngle) * radius;

              x += imageOffsets[i]?.dx || 0;
              y += imageOffsets[i]?.dy || 0;

              const size = 46;
              cx.save();
              try {
                cx.drawImage(img, x - size / 2, y - size / 2, size, size * 1.4);
              } catch (e) {
                // 描画に失敗してもグラフ全体は止めない
              }
              cx.restore();
            });

            // SNS用画像も同じタイミングで更新（画像位置の調整をリアルタイム反映）
            renderSnsCanvas(c);
          }
        }]
      });

      setupDragEvents();
    }

    function setupDragEvents() {
      const canvas = chart.canvas;

      // チャート座標（CSSピクセル）で扱う。高解像度ディスプレイ(スマホ等)でもずれない
      function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (chart.width / rect.width),
          y: (clientY - rect.top) * (chart.height / rect.height)
        };
      }

      function findNearestImage(pos) {
        if (!adjustMode) return null;
        const meta = chart.getDatasetMeta(0);
        let nearest = null;
        let minDist = 50;

        meta.data.forEach((arc, i) => {
          const img = imgElements[i];
          if (!img || img.naturalWidth === 0) return;
          const midAngle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;
          const radius = (arc.outerRadius + arc.innerRadius) / 2 * 0.65;
          const centerX = chart.chartArea.left + (chart.chartArea.right - chart.chartArea.left) / 2;
          const centerY = chart.chartArea.top + (chart.chartArea.bottom - chart.chartArea.top) / 2;
          let x = centerX + Math.cos(midAngle) * radius + (imageOffsets[i]?.dx || 0);
          let y = centerY + Math.sin(midAngle) * radius + (imageOffsets[i]?.dy || 0);

          const dist = Math.hypot(pos.x - x, pos.y - y);
          if (dist < minDist) {
            minDist = dist;
            nearest = i;
          }
        });
        return nearest;
      }

      function onStart(e) {
        if (!adjustMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const idx = findNearestImage(pos);
        if (idx !== null) {
          dragging = {
            index: idx,
            startX: pos.x,
            startY: pos.y,
            startDx: imageOffsets[idx].dx,
            startDy: imageOffsets[idx].dy
          };
        }
      }

      function onMove(e) {
        if (!dragging || !adjustMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        imageOffsets[dragging.index].dx = dragging.startDx + (pos.x - dragging.startX);
        imageOffsets[dragging.index].dy = dragging.startDy + (pos.y - dragging.startY);
        chart.update('none');
      }

      function onEnd() {
        dragging = null;
      }

      // chartを作り直すたびにcanvasは同じなので、古いリスナーが重複しないよう差し替える
      if (canvas._dragHandlers) {
        const h = canvas._dragHandlers;
        canvas.removeEventListener('mousedown', h.onStart);
        canvas.removeEventListener('mousemove', h.onMove);
        canvas.removeEventListener('mouseup', h.onEnd);
        canvas.removeEventListener('mouseleave', h.onEnd);
        canvas.removeEventListener('touchstart', h.onStart);
        canvas.removeEventListener('touchmove', h.onMove);
        canvas.removeEventListener('touchend', h.onEnd);
      }
      canvas._dragHandlers = { onStart, onMove, onEnd };

      canvas.addEventListener('mousedown', onStart);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onEnd);
      canvas.addEventListener('mouseleave', onEnd);
      canvas.addEventListener('touchstart', onStart, { passive: false });
      canvas.addEventListener('touchmove', onMove, { passive: false });
      canvas.addEventListener('touchend', onEnd);
    }

    /* ========== SNS用画像（1920×1080）========== */

    // SNS画像用のカード画像（CORS付きで読み込む。失敗した場合は描画しない）
    function getSnsImage(deckName) {
      const info = getRideInfo(deckName);
      if (!info || !info.画像URL) return null;
      const url = info.画像URL;
      if (!snsImgCache[url]) {
        const img = new Image();
        const entry = { img, ok: false };
        img.crossOrigin = 'anonymous';
        img.onload = () => { entry.ok = img.naturalWidth > 0; renderSnsCanvas(); };
        img.onerror = () => { entry.ok = false; };
        img.src = url;
        snsImgCache[url] = entry;
      }
      const e = snsImgCache[url];
      return e.ok ? e.img : null;
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    function renderSnsCanvas(srcChart) {
      const cv = document.getElementById('snsCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = 1920, H = 1080;
      const mainChart = srcChart || chart;

      // 背景
      ctx.fillStyle = '#10162b';
      ctx.fillRect(0, 0, W, H);
      if (!sortedData.length) {
        ctx.fillStyle = '#8a93b8';
        ctx.font = `bold 44px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('CSVを集計すると、ここにSNS用画像が表示されます', W / 2, H / 2);
        return;
      }

      // 表示するデッキ（上位n件＋その他）
      const n = Math.max(3, Math.min(12, parseInt(document.getElementById('snsTop').value, 10) || 10));
      const top = sortedData.slice(0, n);
      const rest = sortedData.slice(n);
      const slices = top.map((d, i) => ({
        name: d.name, count: d.count, srcIndex: i,
        color: `hsl(${i * 360 / top.length}, 70%, 55%)`
      }));
      if (rest.length) {
        slices.push({
          name: `その他（${rest.length}種類）`,
          count: rest.reduce((a, d) => a + d.count, 0),
          srcIndex: -1, color: '#6b7390'
        });
      }
      slices.forEach(s => { s.percent = (s.count / totalCount * 100).toFixed(1); });

      // ----- 左：タイトル＋箇条書き -----
      const padX = 90;
      const eventName = document.getElementById('eventName').value.trim();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold 66px ${FONT}`;
      ctx.fillText('デッキ使用率分布', padX, 130);
      ctx.fillStyle = '#aab3d6';
      ctx.font = `34px ${FONT}`;
      ctx.fillText((eventName ? eventName + '　' : '') + `全${totalCount}人`, padX, 190);

      const listTop = 235;
      const listBottom = H - 55;
      const rowH = Math.min(78, (listBottom - listTop) / slices.length);
      const thumbH = rowH - 12;
      const thumbW = thumbH * 0.716;
      const fontPx = Math.min(34, Math.floor(rowH * 0.46));
      const statsRight = 960;

      slices.forEach((s, i) => {
        const cy = listTop + rowH * i + rowH / 2;

        // 色チップ（円グラフとの対応）
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(padX + 14, cy, 14, 0, Math.PI * 2);
        ctx.fill();

        // カード画像（無い場合はグレー枠）
        const tx = padX + 46, ty = cy - thumbH / 2;
        const img = s.srcIndex >= 0 ? getSnsImage(s.name) : null;
        if (img) {
          try { ctx.drawImage(img, tx, ty, thumbW, thumbH); } catch (e) { img && 0; }
        } else if (s.srcIndex >= 0) {
          ctx.fillStyle = '#2a3358';
          ctx.fillRect(tx, ty, thumbW, thumbH);
        }

        // 名前と使用率
        const nameX = tx + thumbW + 18;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = `${fontPx}px ${FONT}`;
        const stats = `${s.percent}%（${s.count}人）`;
        ctx.textAlign = 'right';
        ctx.font = `bold ${fontPx}px ${FONT}`;
        const statsW = ctx.measureText(stats).width;
        ctx.fillText(stats, statsRight, cy);
        ctx.textAlign = 'left';
        ctx.font = `${fontPx}px ${FONT}`;
        ctx.fillText(fitText(ctx, s.name, statsRight - statsW - 24 - nameX), nameX, cy);
        ctx.textBaseline = 'alphabetic';
      });

      // ----- 右：円グラフ -----
      const pcx = 1440, pcy = H / 2, R = 420;
      let start = -Math.PI / 2;
      const mids = [];
      slices.forEach(s => {
        const ang = s.count / totalCount * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(pcx, pcy);
        ctx.arc(pcx, pcy, R, start, start + ang);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#10162b';
        ctx.stroke();
        mids.push({ s, mid: start + ang / 2, frac: s.count / totalCount });
        start += ang;
      });

      // カード画像（円グラフ側の調整位置を反映）と割合ラベル
      let mainR = 0;
      if (mainChart && mainChart.getDatasetMeta) {
        const m = mainChart.getDatasetMeta(0);
        mainR = (m.data[0] && m.data[0].outerRadius) || 0;
      }
      const scale = mainR > 0 ? R / mainR : 1;
      const imgW = R * 0.2, imgH = imgW * 1.4;

      mids.forEach(({ s, mid, frac }) => {
        if (s.srcIndex >= 0) {
          const img = getSnsImage(s.name);
          if (img) {
            const off = imageOffsets[s.srcIndex] || { dx: 0, dy: 0 };
            const x = pcx + Math.cos(mid) * R * 0.58 + off.dx * scale;
            const y = pcy + Math.sin(mid) * R * 0.58 + off.dy * scale;
            try { ctx.drawImage(img, x - imgW / 2, y - imgH / 2, imgW, imgH); } catch (e) { /* skip */ }
          }
        }
        if (frac >= 0.04) {
          const x = pcx + Math.cos(mid) * R * 0.88;
          const y = pcy + Math.sin(mid) * R * 0.88;
          ctx.font = `bold 32px ${FONT}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = 6;
          ctx.strokeStyle = 'rgba(16,22,43,0.85)';
          ctx.strokeText(`${s.percent}%`, x, y);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${s.percent}%`, x, y);
          ctx.textBaseline = 'alphabetic';
        }
      });
      ctx.textAlign = 'left';
    }

    function downloadSNSImage() {
      if (!sortedData.length) return alert('先にCSVを集計してください');
      renderSnsCanvas();
      const cv = document.getElementById('snsCanvas');
      try {
        const a = document.createElement('a');
        a.href = cv.toDataURL('image/png');
        a.download = 'deck_usage_sns.png';
        a.click();
      } catch (e) {
        alert('画像の書き出しに失敗しました');
      }
    }

    // ページ読み込み時に自動でマッピングを読み込む
    window.addEventListener('load', () => {
      loadRideLines();
      renderSnsCanvas();
    });
  </script>
</body>
</html>
