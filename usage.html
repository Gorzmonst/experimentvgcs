<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用率分布</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    button { padding: 8px 16px; margin: 5px 5px 5px 0; cursor: pointer; }
    #adjustModeBtn.active { background: #e74c3c; color: white; }
    #adjustHint { color: #666; font-size: 0.9em; display: none; }
    #adjustPanel {
      display: none; margin: 8px 0; padding: 8px 12px;
      border: 1px solid #ddd; border-radius: 6px; background: #fafafa;
    }
    #adjustPanel input[type=range] { width: 220px; vertical-align: middle; }
    #splitPanel {
      display: none; margin: 12px 0; padding: 12px 16px;
      border: 1px solid #c9d0e8; border-radius: 8px; background: #f4f6fb;
    }
    #splitPanel table { width: 100%; border-collapse: collapse; }
    #splitPanel td { padding: 6px 4px; }
    #splitPanel input[type=number] { width: 70px; padding: 4px; }
    #snsCanvas { width: 100%; height: auto; display: block; border: 1px solid #ccc; background: #10162b; }
    #snsCanvas.adjusting { cursor: grab; touch-action: none; }
    #snsCanvas.dragging { cursor: grabbing; }
    #verInfo {
      position: fixed; right: 8px; bottom: 6px; z-index: 10;
      font-size: 11px; line-height: 1.4; color: #888; text-align: right;
      background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px;
      pointer-events: none;
    }
    #percentControls { margin: 8px 0; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: #f9f9f9; }
    #percentControls label { margin-right: 12px; }
  </style>
</head>
<body>
  <p><a href="index.html">← トップへ戻る</a></p>
  <h1>デッキ使用率分布</h1>

  <p>
    トナメルCSV：<input type="file" id="csvFile" accept=".csv">
    デッキ名カラム：<input type="text" id="deckColumn" value="使用されるデッキのG3" style="width:200px">
    <button onclick="processCSV()">集計</button>
  </p>
  <p id="rideStatus">ライドラインマッピング読み込み中...</p>
  <p id="ambStatus">同名カード定義読み込み中...</p>

  <div id="splitPanel">
    <strong>同名カードの振り分け</strong>（合計人数と一致するように入力してください）
    <table id="splitTable"></table>
  </div>

  <p>
    大会名（任意）：<input type="text" id="eventName" style="width:260px" oninput="renderSnsCanvas()">
    リスト表示数：<input type="number" id="snsTop" value="10" min="3" max="12" style="width:60px" oninput="renderSnsCanvas()">
  </p>

  <div id="percentControls">
    <label><input type="checkbox" id="showPercent" checked onchange="renderSnsCanvas()"> ％表示</label>
    距離 <input type="range" id="percentDist" min="80" max="180" value="122" oninput="document.getElementById('percentDistVal').textContent=this.value; renderSnsCanvas()">
    <span id="percentDistVal">122</span>%
  </div>

  <p>
    <button id="adjustModeBtn" onclick="toggleAdjustMode()">画像調整モード: OFF</button>
    <button onclick="resetAll()">全画像の位置・拡大率をリセット</button>
  </p>
  <p id="adjustHint">調整モード中：円グラフの項目をタップして選択し、そのままドラッグで画像の位置を動かせます。拡大・縮小はスライダー（PCはマウスホイールも可）。項目の外にはみ出した部分は表示されません。</p>
  <div id="adjustPanel">
    <div id="selName" style="margin-bottom:4px;">円グラフの項目をタップして選択してください</div>
    拡大率 <input type="range" id="zoomSlider" min="30" max="500" step="5" value="100" oninput="onZoomInput(this.value)">
    <span id="zoomVal">100%</span>
    <button onclick="resetSelected()">この画像をリセット</button>
  </div>

  <canvas id="snsCanvas" width="1920" height="1080"></canvas>
  <p id="imgStatus" style="font-size:0.9em;color:#555;"></p>
  <div id="verInfo"></div>

  <script>
    const APP_VERSION = '2026.11.13-3';

    let AMBIGUOUS_DECKS = {};

    function fmtJst(d) {
      if (!d || isNaN(d)) return '不明';
      return d.toLocaleString('ja-JP', {
        timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }
    let csvLastModified = null;
    function updateVerInfo() {
      const el = document.getElementById('verInfo');
      if (!el) return;
      el.innerHTML =
        `ver ${APP_VERSION}<br>ページ更新: ${fmtJst(new Date(document.lastModified))}` +
        (csvLastModified ? `<br>ridelines.csv更新: ${fmtJst(csvLastModified)}` : '');
    }

    const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif';
    const PIE = { cx: 1440, cy: 540, R: 420 };
    const FACE = { x: 0.5, y: 0.35 };
    const ZOOM_MIN = 0.3, ZOOM_MAX = 5;

    let rideMap = {};
    let rawCounts = {};
    let sortedData = [];
    let totalCount = 0;
    let imageAdj = [];
    let adjustMode = false;
    let selectedIdx = null;
    let dragging = null;
    let sliceGeoms = [];
    let rafPending = false;
    const snsImgCache = {};
    let deckImgState = {};
    let splitState = {};

    let bgImage = null;
    let bgLoaded = false;

    function normKey(s) {
      return String(s || '')
        .normalize('NFKC')
        .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
        .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
        .replace(/\s+/g, '');
    }

    function getCardImageUrl(cardNo) {
      if (!cardNo) return null;
      const parts = cardNo.split('/');
      if (parts.length < 2) return null;
      const set = parts[0].trim();
      let num = parts[1].trim();
      if (!set || !num) return null;
      if (/^\d+$/.test(num)) num = num.padStart(3, '0');
      const setLower = set.toLowerCase().replace(/-/g, '');
      return `https://cf-vanguard.com/wordpress/wp-content/images/cardlist/${set}/${setLower}_${num}.png`;
    }

    function loadBackground() {
      const img = new Image();
      img.onload = () => {
        bgImage = img;
        bgLoaded = true;
        renderSnsCanvas();
      };
      img.onerror = () => {
        console.warn('背景画像の読み込みに失敗しました');
        bgLoaded = false;
      };
      img.src = './expvgcs_background.png';
    }

    function loadRideLines() {
      fetch('./ridelines.csv')
        .then(r => {
          if (!r.ok) throw new Error();
          const lm = r.headers.get('Last-Modified');
          if (lm) { csvLastModified = new Date(lm); updateVerInfo(); }
          return r.text();
        })
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
              buildRideMap(res.data);
              document.getElementById('rideStatus').textContent =
                `ライドラインマッピング読み込み完了（${res.data.length}件）`;
              renderSnsCanvas();
            }
          });
        })
        .catch(() => {
          document.getElementById('rideStatus').textContent = 'ridelines.csv の読み込みに失敗しました';
        });
    }

    function loadAmbiguous() {
      fetch('./ambiguous.csv')
        .then(r => {
          if (!r.ok) throw new Error();
          return r.text();
        })
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
              buildAmbiguous(res.data);
              document.getElementById('ambStatus').textContent =
                `同名カード定義読み込み完了（${Object.keys(AMBIGUOUS_DECKS).length}種類）`;
            }
          });
        })
        .catch(() => {
          document.getElementById('ambStatus').textContent = 'ambiguous.csv が見つからないか読み込めませんでした';
          AMBIGUOUS_DECKS = {};
        });
    }

    function buildAmbiguous(data) {
      AMBIGUOUS_DECKS = {};
      data.forEach(row => {
        const base = (row['正式名称'] || '').trim();
        const label = (row['ラベル'] || '').trim();
        const name = (row['表示名'] || '').trim();
        const cardNo = (row['カード番号'] || '').trim();
        if (!base || !label || !name || !cardNo) return;

        if (!AMBIGUOUS_DECKS[base]) {
          AMBIGUOUS_DECKS[base] = { variants: [] };
        }
        AMBIGUOUS_DECKS[base].variants.push({ label, name, cardNo });
      });
    }

    function buildRideMap(data) {
      rideMap = {};
      data.forEach(row => {
        const full = (row['正式名称'] || '').trim();
        const cardNo = (row['カード番号'] || '').trim();
        if (!full && !cardNo) return;

        const img = getCardImageUrl(cardNo);
        const entry = { 正式名称: full, カード番号: cardNo, 画像URL: img };

        if (full) {
          rideMap[normKey(full)] = entry;
        }

        for (let i = 1; i <= 4; i++) {
          const abbr = (row[`略称${i}`] || '').trim();
          if (abbr) {
            rideMap[normKey(abbr)] = entry;
          }
        }
      });
    }

    function canonicalize(deckName) {
      const info = rideMap[normKey(deckName)];
      return info && info.正式名称 ? info.正式名称 : deckName;
    }

    function getRideInfo(deckName) {
      for (const [base, def] of Object.entries(AMBIGUOUS_DECKS)) {
        for (const v of def.variants) {
          if (deckName === v.name) {
            return { 正式名称: v.name, カード番号: v.cardNo, 画像URL: getCardImageUrl(v.cardNo) };
          }
        }
      }
      return rideMap[normKey(deckName)] || null;
    }

    function processCSV() {
      const file = document.getElementById('csvFile').files[0];
      const columnName = document.getElementById('deckColumn').value.trim();
      if (!file) return alert('CSVを選択してください');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          rawCounts = {};
          let total = 0;
          results.data.forEach(row => {
            if ((row['ステータス'] || '').includes('キャンセル')) return;
            const deck = (row[columnName] || '').trim();
            if (!deck) return;

            const key = canonicalize(deck);
            rawCounts[key] = (rawCounts[key] || 0) + 1;
            total++;
          });
          if (!total) return alert('データが見つかりません。カラム名を確認してください');

          splitState = {};
          for (const name of Object.keys(AMBIGUOUS_DECKS)) {
            if (rawCounts[name]) {
              const totalN = rawCounts[name];
              splitState[name] = {};
              AMBIGUOUS_DECKS[name].variants.forEach((v, i) => {
                splitState[name][v.label] = i === 0 ? totalN : 0;
              });
            }
          }

          buildFinalData();
          renderSplitPanel();
          renderSnsCanvas();
        }
      });
    }

    function buildFinalData() {
      const counts = { ...rawCounts };

      for (const [base, def] of Object.entries(AMBIGUOUS_DECKS)) {
        if (!counts[base]) continue;
        delete counts[base];
        def.variants.forEach(v => {
          const n = splitState[base]?.[v.label] || 0;
          if (n > 0) counts[v.name] = n;
        });
      }

      totalCount = Object.values(counts).reduce((a, b) => a + b, 0);
      sortedData = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([name, count]) => ({
          name,
          count,
          percent: (count / totalCount * 100).toFixed(1)
        }));

      imageAdj = sortedData.map(() => ({ dx: 0, dy: 0, zoom: 1 }));
      selectedIdx = null;
      updateAdjustPanel();
    }

    function renderSplitPanel() {
      const panel = document.getElementById('splitPanel');
      const table = document.getElementById('splitTable');
      const targets = Object.keys(AMBIGUOUS_DECKS).filter(n => rawCounts[n]);

      if (!targets.length) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';

      let html = '';
      targets.forEach(base => {
        const total = rawCounts[base];
        const def = AMBIGUOUS_DECKS[base];
        html += `<tr><td colspan="3"><strong>${base}</strong>（合計 ${total}人）</td></tr>`;
        def.variants.forEach(v => {
          const val = splitState[base][v.label] || 0;
          html += `<tr>
            <td>${v.label}</td>
            <td><input type="number" min="0" max="${total}" value="${val}"
              data-base="${base}" data-label="${v.label}"
              oninput="onSplitInput(this)"></td>
            <td>人</td>
          </tr>`;
        });
      });
      table.innerHTML = html;
    }

    function onSplitInput(input) {
      const base = input.dataset.base;
      const label = input.dataset.label;
      const total = rawCounts[base];
      let val = Math.max(0, Math.min(total, parseInt(input.value, 10) || 0));
      input.value = val;

      const def = AMBIGUOUS_DECKS[base];
      const others = def.variants.filter(v => v.label !== label);
      const remain = total - val;

      if (others.length) {
        others.forEach((v, i) => {
          splitState[base][v.label] = i === 0 ? remain : 0;
        });
      }
      splitState[base][label] = val;

      renderSplitPanel();
      buildFinalData();
      renderSnsCanvas();
    }

    function toggleAdjustMode() {
      adjustMode = !adjustMode;
      const btn = document.getElementById('adjustModeBtn');
      btn.textContent = `画像調整モード: ${adjustMode ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', adjustMode);
      document.getElementById('adjustHint').style.display = adjustMode ? 'block' : 'none';
      document.getElementById('adjustPanel').style.display = adjustMode ? 'block' : 'none';
      document.getElementById('snsCanvas').classList.toggle('adjusting', adjustMode);
      renderSnsCanvas();
    }

    function updateAdjustPanel() {
      const name = document.getElementById('selName');
      const slider = document.getElementById('zoomSlider');
      const val = document.getElementById('zoomVal');
      if (selectedIdx === null || !imageAdj[selectedIdx]) {
        name.textContent = '円グラフの項目をタップして選択してください';
        slider.disabled = true;
        return;
      }
      slider.disabled = false;
      name.textContent = `選択中：${sortedData[selectedIdx].name}`;
      const z = Math.round(imageAdj[selectedIdx].zoom * 100);
      slider.value = z;
      val.textContent = `${z}%`;
    }

    function setZoom(idx, z) {
      imageAdj[idx].zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
      updateAdjustPanel();
      scheduleRender();
    }

    function onZoomInput(v) {
      if (selectedIdx === null) return;
      setZoom(selectedIdx, Number(v) / 100);
    }

    function resetSelected() {
      if (selectedIdx === null || !imageAdj[selectedIdx]) return;
      imageAdj[selectedIdx] = { dx: 0, dy: 0, zoom: 1 };
      updateAdjustPanel();
      renderSnsCanvas();
    }

    function resetAll() {
      imageAdj = imageAdj.map(() => ({ dx: 0, dy: 0, zoom: 1 }));
      updateAdjustPanel();
      renderSnsCanvas();
    }

    function getSnsImage(deckName) {
      const info = getRideInfo(deckName);
      if (!info) { deckImgState[deckName] = '未登録'; return null; }
      if (!info.画像URL) { deckImgState[deckName] = '番号未設定'; return null; }
      const url = info.画像URL;
      let e = snsImgCache[url];
      if (!e) {
        e = { img: null, ok: false, tainted: false, failed: false };
        snsImgCache[url] = e;
        const tryLoad = (cors) => {
          const img = new Image();
          if (cors) img.crossOrigin = 'anonymous';
          img.onload = () => {
            if (img.naturalWidth > 0) { e.img = img; e.ok = true; e.tainted = !cors; renderSnsCanvas(); }
          };
          img.onerror = () => {
            if (cors) tryLoad(false); else { e.failed = true; renderSnsCanvas(); }
          };
          img.src = url;
        };
        tryLoad(true);
      }
      if (e.ok) {
        deckImgState[deckName] = e.tainted ? '表示のみ' : 'OK';
        return e.img;
      }
      deckImgState[deckName] = e.failed ? '読み込み失敗' : '読み込み中';
      return null;
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    function sectorPath(ctx, g) {
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy);
      ctx.arc(g.cx, g.cy, g.R, g.a0, g.a1);
      ctx.closePath();
    }

    function baseImageWidth(g) {
      const span = Math.min(g.a1 - g.a0, Math.PI);
      const chord = 2 * 0.6 * g.R * Math.sin(span / 2);
      return Math.max(g.R * 0.45, Math.min(g.R * 1.1, chord * 3.2));
    }

    function anchorPoint(g) {
      const mid = (g.a0 + g.a1) / 2;
      return { x: g.cx + Math.cos(mid) * g.R * 0.6, y: g.cy + Math.sin(mid) * g.R * 0.6 };
    }

    function renderSnsCanvas() {
      const cv = document.getElementById('snsCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = 1920, H = 1080;
      sliceGeoms = [];

      // 背景
      if (bgLoaded && bgImage) {
        ctx.drawImage(bgImage, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#10162b';
        ctx.fillRect(0, 0, W, H);
      }

      if (!sortedData.length) {
        ctx.fillStyle = '#8a93b8';
        ctx.font = `bold 44px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('CSVを集計すると、ここにSNS用画像が表示されます', W / 2, H / 2);
        return;
      }

      const n = Math.max(3, Math.min(12, parseInt(document.getElementById('snsTop').value, 10) || 10));
      const top = sortedData.slice(0, n);
      const rest = sortedData.slice(n);
      const slices = top.map((d, i) => ({
        name: d.name, count: d.count, srcIndex: i,
        color: `hsl(${i * 360 / top.length}, 70%, 55%)`
      }));
      if (rest.length) {
        slices.push({
          name: `その他（${rest.length}種類）`,
          count: rest.reduce((a, d) => a + d.count, 0),
          srcIndex: -1, color: '#6b7390'
        });
      }
      slices.forEach(s => { s.percent = (s.count / totalCount * 100).toFixed(1); });

      const padX = 90;
      const eventName = document.getElementById('eventName').value.trim();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold 66px ${FONT}`;
      ctx.fillText('デッキ使用率分布', padX, 130);
      ctx.fillStyle = '#aab3d6';
      ctx.font = `34px ${FONT}`;
      ctx.fillText((eventName ? eventName + '　' : '') + `全${totalCount}人`, padX, 190);

      const listTop = 235;
      const listBottom = H - 55;
      const rowH = Math.min(78, (listBottom - listTop) / slices.length);
      const thumbH = rowH - 12;
      const thumbW = thumbH * 0.716;
      const fontPx = Math.min(34, Math.floor(rowH * 0.46));
      const statsRight = 960;

      slices.forEach((s, i) => {
        const cy = listTop + rowH * i + rowH / 2;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(padX + 14, cy, 14, 0, Math.PI * 2);
        ctx.fill();

        const tx = padX + 46, ty = cy - thumbH / 2;
        const img = s.srcIndex >= 0 ? getSnsImage(s.name) : null;
        if (img) {
          try { ctx.drawImage(img, tx, ty, thumbW, thumbH); } catch (e) {}
        } else if (s.srcIndex >= 0) {
          ctx.fillStyle = '#2a3358';
          ctx.fillRect(tx, ty, thumbW, thumbH);
        }

        const nameX = tx + thumbW + 18;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        const stats = `${s.percent}%（${s.count}人）`;
        ctx.textAlign = 'right';
        ctx.font = `bold ${fontPx}px ${FONT}`;
        const statsW = ctx.measureText(stats).width;
        ctx.fillText(stats, statsRight, cy);
        ctx.textAlign = 'left';
        ctx.font = `${fontPx}px ${FONT}`;
        ctx.fillText(fitText(ctx, s.name, statsRight - statsW - 24 - nameX), nameX, cy);
        ctx.textBaseline = 'alphabetic';
      });

      const { cx: pcx, cy: pcy, R } = PIE;
      let start = -Math.PI / 2;
      const mids = [];
      slices.forEach(s => {
        const ang = s.count / totalCount * Math.PI * 2;
        const g = { cx: pcx, cy: pcy, R, a0: start, a1: start + ang };
        mids.push({ s, g, mid: start + ang / 2, frac: s.count / totalCount });
        sliceGeoms.push({ srcIndex: s.srcIndex, g });
        start += ang;
      });

      mids.forEach(({ s, g }) => {
        sectorPath(ctx, g);
        ctx.fillStyle = s.color;
        ctx.fill();
      });

      mids.forEach(({ s, g }) => {
        if (s.srcIndex < 0) return;
        const img = getSnsImage(s.name);
        if (!img) return;
        const adj = imageAdj[s.srcIndex] || (imageAdj[s.srcIndex] = { dx: 0, dy: 0, zoom: 1 });
        const w = baseImageWidth(g) * adj.zoom;
        const h = w * (img.naturalHeight / img.naturalWidth);
        const a = anchorPoint(g);
        const fx = a.x + adj.dx, fy = a.y + adj.dy;
        ctx.save();
        sectorPath(ctx, g);
        ctx.clip();
        try { ctx.drawImage(img, fx - FACE.x * w, fy - FACE.y * h, w, h); } catch (e) {}
        ctx.restore();
      });

      mids.forEach(({ g }) => {
        sectorPath(ctx, g);
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#10162b';
        ctx.stroke();
      });

      // 4) 割合ラベル（距離・表示ON/OFF対応）
      const showPercent = document.getElementById('showPercent').checked;
      const distRatio = parseInt(document.getElementById('percentDist').value, 10) / 100;
      if (showPercent) {
        mids.forEach(({ s, mid, frac }) => {
          if (frac < 0.035) return;
          const dist = R * distRatio;
          const x = pcx + Math.cos(mid) * dist;
          const y = pcy + Math.sin(mid) * dist;
          ctx.font = `bold 32px ${FONT}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineWidth = 6;
          ctx.strokeStyle = 'rgba(16,22,43,0.85)';
          ctx.strokeText(`${s.percent}%`, x, y);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${s.percent}%`, x, y);
          ctx.textBaseline = 'alphabetic';
        });
      }

      if (adjustMode && selectedIdx !== null) {
        const m = mids.find(x => x.s.srcIndex === selectedIdx);
        if (m) {
          sectorPath(ctx, m.g);
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#ffffff';
          ctx.setLineDash([14, 10]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ctx.textAlign = 'left';
      updateImgStatus(top);
    }

    function updateImgStatus(top) {
      const el = document.getElementById('imgStatus');
      if (!el) return;
      const bad = top
        .map(d => [d.name, deckImgState[d.name]])
        .filter(([, st]) => st && st !== 'OK');
      el.textContent = bad.length
        ? '画像の状態：' + bad.map(([n, st]) => `${n}（${st}）`).join('、')
        : '画像の状態：すべて表示OK';
    }

    function scheduleRender() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; renderSnsCanvas(); });
    }

    function sliceAt(x, y) {
      for (const { srcIndex, g } of sliceGeoms) {
        if (srcIndex < 0) continue;
        const dx = x - g.cx, dy = y - g.cy;
        if (Math.hypot(dx, dy) > g.R) continue;
        const span = g.a1 - g.a0;
        let rel = Math.atan2(dy, dx) - g.a0;
        while (rel < 0) rel += Math.PI * 2;
        while (rel >= Math.PI * 2) rel -= Math.PI * 2;
        if (rel <= span || span >= Math.PI * 2 - 1e-6) return srcIndex;
      }
      return null;
    }

    function setupDrag() {
      const cv = document.getElementById('snsCanvas');
      function pos(e) {
        const rect = cv.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (cv.width / rect.width),
          y: (e.clientY - rect.top) * (cv.height / rect.height)
        };
      }
      cv.addEventListener('pointerdown', (e) => {
        if (!adjustMode) return;
        const p = pos(e);
        const idx = sliceAt(p.x, p.y);
        if (idx === null) return;
        selectedIdx = idx;
        updateAdjustPanel();
        const a = imageAdj[idx];
        dragging = { index: idx, startX: p.x, startY: p.y, startDx: a.dx, startDy: a.dy };
        cv.setPointerCapture(e.pointerId);
        cv.classList.add('dragging');
        e.preventDefault();
        scheduleRender();
      });
      cv.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const p = pos(e);
        const a = imageAdj[dragging.index];
        a.dx = dragging.startDx + (p.x - dragging.startX);
        a.dy = dragging.startDy + (p.y - dragging.startY);
        scheduleRender();
        e.preventDefault();
      });
      const end = () => {
        dragging = null;
        cv.classList.remove('dragging');
      };
      cv.addEventListener('pointerup', end);
      cv.addEventListener('pointercancel', end);
      cv.addEventListener('wheel', (e) => {
        if (!adjustMode || selectedIdx === null || !imageAdj[selectedIdx]) return;
        e.preventDefault();
        const f = e.deltaY < 0 ? 1.08 : 1 / 1.08;
        setZoom(selectedIdx, imageAdj[selectedIdx].zoom * f);
      }, { passive: false });
    }

    window.addEventListener('load', () => {
      setupDrag();
      updateAdjustPanel();
      updateVerInfo();
      loadBackground();
      loadRideLines();
      loadAmbiguous();
      renderSnsCanvas();
    });
  </script>
</body>
</html>
