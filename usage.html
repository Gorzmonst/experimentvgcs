<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用率分布</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    button { padding: 8px 16px; margin: 5px 5px 5px 0; cursor: pointer; }
    #adjustModeBtn.active { background: #e74c3c; color: white; }
    #adjustHint { color: #666; font-size: 0.9em; display: none; }
    #snsCanvas { width: 100%; height: auto; display: block; border: 1px solid #ccc; background: #10162b; }
    #snsCanvas.adjusting { cursor: grab; touch-action: none; }
    #snsCanvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <p><a href="index.html">← トップへ戻る</a></p>
  <h1>デッキ使用率分布</h1>

  <p>
    トナメルCSV：<input type="file" id="csvFile" accept=".csv">
    デッキ名カラム：<input type="text" id="deckColumn" value="使用されるデッキのG3" style="width:200px">
    <button onclick="processCSV()">集計</button>
  </p>
  <p id="rideStatus">ライドラインマッピング読み込み中...</p>

  <p>
    大会名（任意）：<input type="text" id="eventName" style="width:260px" oninput="renderSnsCanvas()">
    リスト表示数：<input type="number" id="snsTop" value="10" min="3" max="12" style="width:60px" oninput="renderSnsCanvas()">
  </p>

  <p>
    <button id="adjustModeBtn" onclick="toggleAdjustMode()">画像調整モード: OFF</button>
    <button onclick="resetOffsets()">画像位置をリセット</button>
  </p>
  <p id="adjustHint">調整モード中：円グラフ上のカード画像をドラッグ（スマホはタップしたまま移動）して位置を調整できます</p>

  <canvas id="snsCanvas" width="1920" height="1080"></canvas>
  <p id="imgStatus" style="font-size:0.9em;color:#555;"></p>
  <p><button onclick="downloadSNSImage()">SNS用画像をダウンロード（1920×1080）</button></p>

  <script>
    let rideMap = {};
    let sortedData = [];
    let totalCount = 0;
    let imageOffsets = [];   // sortedDataと同じ並び。値はSNS画像(1920×1080)上のピクセル
    let adjustMode = false;
    let dragging = null;
    let hitBoxes = [];       // 円グラフ上のカード画像の位置（クリック判定用）
    let rafPending = false;

    const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif';
    const snsImgCache = {}; // url -> { img, ok }

    // デッキ名の表記ゆれを吸収（全角半角・引用符・空白）
    function normKey(s) {
      return String(s || '')
        .normalize('NFKC')
        .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
        .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
        .replace(/\s+/g, '');
    }

    function getCardImageUrl(cardNo) {
      if (!cardNo) return null;
      const parts = cardNo.split('/');
      if (parts.length < 2) return null;
      const set = parts[0].trim();
      let num = parts[1].trim();
      if (!set || !num) return null;
      if (/^\d+$/.test(num)) num = num.padStart(3, '0');
      const setLower = set.toLowerCase().replace(/-/g, '');
      return `https://cf-vanguard.com/wordpress/wp-content/images/cardlist/${set}/${setLower}_${num}.png`;
    }

    function loadRideLines() {
      fetch('./ridelines.csv')
        .then(r => {
          if (!r.ok) throw new Error();
          return r.text();
        })
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
              buildRideMap(res.data);
              document.getElementById('rideStatus').textContent =
                `ライドラインマッピング読み込み完了（${res.data.length}件）`;
              renderSnsCanvas();
            }
          });
        })
        .catch(() => {
          document.getElementById('rideStatus').textContent = 'ridelines.csv の読み込みに失敗しました';
        });
    }

    function buildRideMap(data) {
      rideMap = {};
      data.forEach(row => {
        const abbr = (row['略称'] || '').trim();
        const full = (row['正式名称'] || '').trim();
        const cardNo = (row['カード番号'] || '').trim();
        if (!abbr && !full) return;
        const img = getCardImageUrl(cardNo); // 番号が空なら null
        const entry = { 正式名称: full, カード番号: cardNo, 画像URL: img };
        if (abbr) rideMap[normKey(abbr)] = entry;
        if (full) rideMap[normKey(full)] = entry;
      });
    }

    function getRideInfo(deckName) {
      return rideMap[normKey(deckName)] || null;
    }

    function toggleAdjustMode() {
      adjustMode = !adjustMode;
      const btn = document.getElementById('adjustModeBtn');
      btn.textContent = `画像調整モード: ${adjustMode ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', adjustMode);
      document.getElementById('adjustHint').style.display = adjustMode ? 'block' : 'none';
      document.getElementById('snsCanvas').classList.toggle('adjusting', adjustMode);
    }

    function resetOffsets() {
      imageOffsets = imageOffsets.map(() => ({ dx: 0, dy: 0 }));
      renderSnsCanvas();
    }

    function processCSV() {
      const file = document.getElementById('csvFile').files[0];
      const columnName = document.getElementById('deckColumn').value.trim();
      if (!file) return alert('CSVを選択してください');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const counts = {};
          let total = 0;
          results.data.forEach(row => {
            // トナメルCSVの「エントリーキャンセル」は集計から除外
            if ((row['ステータス'] || '').includes('キャンセル')) return;
            const deck = (row[columnName] || '').trim();
            if (deck) {
              counts[deck] = (counts[deck] || 0) + 1;
              total++;
            }
          });
          if (!total) return alert('データが見つかりません。カラム名を確認してください');

          totalCount = total;
          sortedData = Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => ({
              name,
              count,
              percent: (count / total * 100).toFixed(1)
            }));

          imageOffsets = sortedData.map(() => ({ dx: 0, dy: 0 }));
          renderSnsCanvas();
        }
      });
    }

    /* ========== SNS用画像（1920×1080）========== */

    // カード画像の読み込み。まずCORS付き（書き出し可能）で試し、失敗したらCORS無しで表示だけ行う
    let exportMode = false;      // trueの間は「書き出し不可の画像」を描かない
    let deckImgState = {};       // デッキ名 -> 状態（画面下の診断表示用）

    function getSnsImage(deckName) {
      const info = getRideInfo(deckName);
      if (!info) { deckImgState[deckName] = '未登録'; return null; }
      if (!info.画像URL) { deckImgState[deckName] = '番号未設定'; return null; }
      const url = info.画像URL;
      let e = snsImgCache[url];
      if (!e) {
        e = { img: null, ok: false, tainted: false, failed: false };
        snsImgCache[url] = e;
        const tryLoad = (cors) => {
          const img = new Image();
          if (cors) img.crossOrigin = 'anonymous';
          img.onload = () => {
            if (img.naturalWidth > 0) { e.img = img; e.ok = true; e.tainted = !cors; renderSnsCanvas(); }
          };
          img.onerror = () => {
            if (cors) tryLoad(false); else { e.failed = true; renderSnsCanvas(); }
          };
          img.src = url;
        };
        tryLoad(true);
      }
      if (e.ok) {
        if (e.tainted && exportMode) { deckImgState[deckName] = '書き出し不可'; return null; }
        deckImgState[deckName] = e.tainted ? '表示のみ（書き出し不可）' : 'OK';
        return e.img;
      }
      deckImgState[deckName] = e.failed ? '読み込み失敗' : '読み込み中';
      return null;
    }

    function fitText(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    /* ----- カード画像を、自分の項目（扇形）からはみ出さないように置くための計算 ----- */
    const TWO_PI = Math.PI * 2;
    const PAD = 8; // 扇形の縁からあける余白(px)

    function pointInSector(px, py, g) {
      const dx = px - g.cx, dy = py - g.cy;
      const r = Math.hypot(dx, dy);
      if (r > g.R - PAD) return false;
      const span = g.a1 - g.a0;
      if (span >= TWO_PI - 1e-6) return true; // 項目が1つだけ（円全体）
      let rel = Math.atan2(dy, dx) - g.a0;
      while (rel < 0) rel += TWO_PI;
      while (rel >= TWO_PI) rel -= TWO_PI;
      if (rel > span) return false;
      const rel1 = span - rel;
      const d0 = rel < Math.PI / 2 ? r * Math.sin(rel) : r;
      const d1 = rel1 < Math.PI / 2 ? r * Math.sin(rel1) : r;
      return d0 >= PAD && d1 >= PAD;
    }

    // 画像（中心x,y・幅w・高さh）が扇形に完全に収まるか（外周と中心を細かく調べる）
    function rectFits(x, y, w, h, g) {
      if (!pointInSector(x, y, g)) return false;
      const N = 8, hw = w / 2, hh = h / 2;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const px = x - hw + w * t, py = y - hh + h * t;
        if (!pointInSector(px, y - hh, g) || !pointInSector(px, y + hh, g)) return false;
        if (!pointInSector(x - hw, py, g) || !pointInSector(x + hw, py, g)) return false;
      }
      return true;
    }

    // 初期位置とサイズ：収まる中で一番大きく、扇形の中ほどに置く（狭い項目では画像を小さくする）
    function placeImage(g, mid) {
      const baseW = g.R * 0.2;
      const rs = [];
      for (let f = 0.2; f <= 0.9; f += 0.02) rs.push(f);
      rs.sort((a, b) => Math.abs(a - 0.58) - Math.abs(b - 0.58));
      for (let sc = 1; sc >= 0.3; sc -= 0.05) {
        const w = baseW * sc, h = w * 1.4;
        for (const f of rs) {
          const x = g.cx + Math.cos(mid) * g.R * f;
          const y = g.cy + Math.sin(mid) * g.R * f;
          if (rectFits(x, y, w, h, g)) return { x, y, w, h };
        }
      }
      return null; // 小さくしても収まらない場合は画像を出さない
    }

    // prevから希望位置wantへ動かす。はみ出すなら縁に沿って動き、動けなければ手前で止める
    function clampMove(prev, want, w, h, g) {
      if (rectFits(want.x, want.y, w, h, g)) return want;
      const ax = { x: want.x, y: prev.y };
      if (rectFits(ax.x, ax.y, w, h, g)) return ax;
      const ay = { x: prev.x, y: want.y };
      if (rectFits(ay.x, ay.y, w, h, g)) return ay;
      let lo = 0, hi = 1;
      for (let i = 0; i < 16; i++) {
        const m = (lo + hi) / 2;
        if (rectFits(prev.x + (want.x - prev.x) * m, prev.y + (want.y - prev.y) * m, w, h, g)) lo = m; else hi = m;
      }
      return { x: prev.x + (want.x - prev.x) * lo, y: prev.y + (want.y - prev.y) * lo };
    }

    function renderSnsCanvas() {
      const cv = document.getElementById('snsCanvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const W = 1920, H = 1080;
      hitBoxes = [];

      // 背景
      ctx.fillStyle = '#10162b';
      ctx.fillRect(0, 0, W, H);
      if (!sortedData.length) {
        ctx.fillStyle = '#8a93b8';
        ctx.font = `bold 44px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.fillText('CSVを集計すると、ここにSNS用画像が表示されます', W / 2, H / 2);
        return;
      }

      // 表示するデッキ（上位n件＋その他）
      const n = Math.max(3, Math.min(12, parseInt(document.getElementById('snsTop').value, 10) || 10));
      const top = sortedData.slice(0, n);
      const rest = sortedData.slice(n);
      const slices = top.map((d, i) => ({
        name: d.name, count: d.count, srcIndex: i,
        color: `hsl(${i * 360 / top.length}, 70%, 55%)`
      }));
      if (rest.length) {
        slices.push({
          name: `その他（${rest.length}種類）`,
          count: rest.reduce((a, d) => a + d.count, 0),
          srcIndex: -1, color: '#6b7390'
        });
      }
      slices.forEach(s => { s.percent = (s.count / totalCount * 100).toFixed(1); });

      // ----- 左：タイトル＋箇条書き -----
      const padX = 90;
      const eventName = document.getElementById('eventName').value.trim();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold 66px ${FONT}`;
      ctx.fillText('デッキ使用率分布', padX, 130);
      ctx.fillStyle = '#aab3d6';
      ctx.font = `34px ${FONT}`;
      ctx.fillText((eventName ? eventName + '　' : '') + `全${totalCount}人`, padX, 190);

      const listTop = 235;
      const listBottom = H - 55;
      const rowH = Math.min(78, (listBottom - listTop) / slices.length);
      const thumbH = rowH - 12;
      const thumbW = thumbH * 0.716;
      const fontPx = Math.min(34, Math.floor(rowH * 0.46));
      const statsRight = 960;

      slices.forEach((s, i) => {
        const cy = listTop + rowH * i + rowH / 2;

        // 色チップ（円グラフとの対応）
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(padX + 14, cy, 14, 0, Math.PI * 2);
        ctx.fill();

        // カード画像（無い場合はグレー枠）
        const tx = padX + 46, ty = cy - thumbH / 2;
        const img = s.srcIndex >= 0 ? getSnsImage(s.name) : null;
        if (img) {
          try { ctx.drawImage(img, tx, ty, thumbW, thumbH); } catch (e) { /* skip */ }
        } else if (s.srcIndex >= 0) {
          ctx.fillStyle = '#2a3358';
          ctx.fillRect(tx, ty, thumbW, thumbH);
        }

        // 名前と使用率
        const nameX = tx + thumbW + 18;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        const stats = `${s.percent}%（${s.count}人）`;
        ctx.textAlign = 'right';
        ctx.font = `bold ${fontPx}px ${FONT}`;
        const statsW = ctx.measureText(stats).width;
        ctx.fillText(stats, statsRight, cy);
        ctx.textAlign = 'left';
        ctx.font = `${fontPx}px ${FONT}`;
        ctx.fillText(fitText(ctx, s.name, statsRight - statsW - 24 - nameX), nameX, cy);
        ctx.textBaseline = 'alphabetic';
      });

      // ----- 右：円グラフ -----
      const pcx = 1440, pcy = H / 2, R = 420;
      let start = -Math.PI / 2;
      const mids = [];
      slices.forEach(s => {
        const ang = s.count / totalCount * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(pcx, pcy);
        ctx.arc(pcx, pcy, R, start, start + ang);
        ctx.closePath();
        ctx.fillStyle = s.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#10162b';
        ctx.stroke();
        mids.push({ s, mid: start + ang / 2, frac: s.count / totalCount,
                    g: { cx: pcx, cy: pcy, R, a0: start, a1: start + ang } });
        start += ang;
      });

      // カード画像（自分の項目の中に収まるように配置）
      mids.forEach(({ s, mid, g }) => {
        if (s.srcIndex < 0) return;
        const img = getSnsImage(s.name);
        if (!img) return;
        const pl = placeImage(g, mid);
        if (!pl) return;
        const off = imageOffsets[s.srcIndex] || (imageOffsets[s.srcIndex] = { dx: 0, dy: 0 });
        let c = { x: pl.x + off.dx, y: pl.y + off.dy };
        if (!rectFits(c.x, c.y, pl.w, pl.h, g)) {
          c = clampMove({ x: pl.x, y: pl.y }, c, pl.w, pl.h, g); // 項目の外に出ていたら内側へ戻す
          off.dx = c.x - pl.x; off.dy = c.y - pl.y;
        }
        try { ctx.drawImage(img, c.x - pl.w / 2, c.y - pl.h / 2, pl.w, pl.h); } catch (e) { return; }
        if (adjustMode) {
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.setLineDash([8, 6]);
          ctx.strokeRect(c.x - pl.w / 2, c.y - pl.h / 2, pl.w, pl.h);
          ctx.setLineDash([]);
        }
        hitBoxes.push({ srcIndex: s.srcIndex, x: c.x - pl.w / 2, y: c.y - pl.h / 2, w: pl.w, h: pl.h,
                        cx: c.x, cy: c.y, defX: pl.x, defY: pl.y, g });
      });

      // 割合ラベル（画像より手前に描いて読めるようにする）
      mids.forEach(({ s, mid, frac }) => {
        if (frac < 0.04) return;
        const x = pcx + Math.cos(mid) * R * 0.88;
        const y = pcy + Math.sin(mid) * R * 0.88;
        ctx.font = `bold 32px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'rgba(16,22,43,0.85)';
        ctx.strokeText(`${s.percent}%`, x, y);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${s.percent}%`, x, y);
        ctx.textBaseline = 'alphabetic';
      });
      ctx.textAlign = 'left';
      updateImgStatus(top);
    }

    // 画像が出ていないデッキを画面の下に表示（原因の切り分け用）
    function updateImgStatus(top) {
      const el = document.getElementById('imgStatus');
      if (!el) return;
      const bad = top
        .map(d => [d.name, deckImgState[d.name]])
        .filter(([, st]) => st && st !== 'OK');
      el.textContent = bad.length
        ? '画像の状態：' + bad.map(([n, st]) => `${n}（${st}）`).join('、')
        : '画像の状態：すべて表示OK';
    }

    function scheduleRender() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; renderSnsCanvas(); });
    }

    /* ========== プレビューを直接ドラッグして画像位置を調整 ========== */

    function setupDrag() {
      const cv = document.getElementById('snsCanvas');

      function pos(e) {
        const rect = cv.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (cv.width / rect.width),
          y: (e.clientY - rect.top) * (cv.height / rect.height)
        };
      }

      cv.addEventListener('pointerdown', (e) => {
        if (!adjustMode) return;
        const p = pos(e);
        // 手前（後に描いたもの）から判定。少し余白を持たせる
        const m = 12;
        for (let i = hitBoxes.length - 1; i >= 0; i--) {
          const b = hitBoxes[i];
          if (p.x >= b.x - m && p.x <= b.x + b.w + m && p.y >= b.y - m && p.y <= b.y + b.h + m) {
            dragging = { box: b, startX: p.x, startY: p.y, startCx: b.cx, startCy: b.cy, cur: { x: b.cx, y: b.cy } };
            cv.setPointerCapture(e.pointerId);
            cv.classList.add('dragging');
            e.preventDefault();
            return;
          }
        }
      });

      cv.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const p = pos(e);
        const b = dragging.box;
        const want = { x: dragging.startCx + (p.x - dragging.startX), y: dragging.startCy + (p.y - dragging.startY) };
        // 自分の項目の外には出ないように制限
        dragging.cur = clampMove(dragging.cur, want, b.w, b.h, b.g);
        imageOffsets[b.srcIndex].dx = dragging.cur.x - b.defX;
        imageOffsets[b.srcIndex].dy = dragging.cur.y - b.defY;
        scheduleRender();
        e.preventDefault();
      });

      const end = () => {
        dragging = null;
        cv.classList.remove('dragging');
      };
      cv.addEventListener('pointerup', end);
      cv.addEventListener('pointercancel', end);
    }

    function downloadSNSImage() {
      if (!sortedData.length) return alert('先にCSVを集計してください');
      // 調整用の枠線が写り込まないよう、一時的にOFF相当で描き直して書き出す
      const prev = adjustMode;
      adjustMode = false;
      const cv = document.getElementById('snsCanvas');
      const save = (url) => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'deck_usage_sns.png';
        a.click();
      };
      try {
        renderSnsCanvas();
        try {
          save(cv.toDataURL('image/png'));
        } catch (e) {
          // 公式サイトの画像がCORS非対応だと、そのままでは書き出せない → 画像なしで書き出す
          exportMode = true;
          renderSnsCanvas();
          save(cv.toDataURL('image/png'));
          alert('公式サイトの画像は書き出しが許可されていないため、カード画像なしで保存しました。\n画像入りにするには、画像を自分のサイトに置く必要があります。');
        }
      } catch (e) {
        alert('画像の書き出しに失敗しました');
      } finally {
        exportMode = false;
        adjustMode = prev;
        renderSnsCanvas();
      }
    }

    window.addEventListener('load', () => {
      setupDrag();
      loadRideLines();
      renderSnsCanvas();
    });
  </script>
</body>
</html>
