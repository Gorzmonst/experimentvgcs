<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用率分布</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }
    #list li { margin: 8px 0; }
    .sns-area { margin-top: 30px; border: 1px solid #ddd; padding: 15px; background: #fafafa; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    #adjustModeBtn.active { background: #e74c3c; color: white; }
    #adjustHint { color: #666; font-size: 0.9em; display: none; }
    canvas { touch-action: none; }
    .sns-row { margin: 6px 0; display: flex; align-items: center; }
    .thumb, .thumb-ph {
      width: 36px; height: 50px; margin-right: 8px; flex-shrink: 0;
      object-fit: cover; background: #ddd; border-radius: 2px;
    }
  </style>
</head>
<body>
  <p><a href="index.html">← トップへ戻る</a></p>
  <h1>デッキ使用率分布</h1>

  <p>
    トナメルCSV：<input type="file" id="csvFile" accept=".csv">
    デッキ名カラム：<input type="text" id="deckColumn" value="使用されるデッキのG3" style="width:200px">
    <button onclick="processCSV()">集計</button>
  </p>

  <p id="rideStatus">ライドラインマッピング読み込み中...</p>

  <p>
    <button id="adjustModeBtn" onclick="toggleAdjustMode()">画像調整モード: OFF</button>
    <button onclick="resetOffsets()">画像位置をリセット</button>
  </p>
  <p id="adjustHint">調整モード中：画像をドラッグ（スマホはタップしたまま移動）して位置を調整できます</p>

  <div id="list"></div>
  <canvas id="pieChart" style="max-width:700px; margin:20px auto; display:block;"></canvas>

  <div class="sns-area" id="snsCapture">
    <h2>SNS投稿用まとめ</h2>
    <div id="snsContent"></div>
  </div>
  <button onclick="downloadSNSImage()">SNS用画像をダウンロード</button>

  <script>
    let rideMap = {};
    let chart = null;
    let sortedData = [];
    let imageOffsets = [];
    let adjustMode = false;
    let dragging = null;
    let imgElements = [];

    // HTMLエスケープ（CSVの文字列をinnerHTMLに入れるため）
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // デッキ名の表記ゆれを吸収（全角半角・引用符の種類）
    function normKey(s) {
      return String(s || '')
        .normalize('NFKC')
        .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
        .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
        .replace(/\s+/g, '');
    }

    // 画像が無い場合のグレー枠（HTML文字列／onerror用）
    function makePlaceholder() {
      const span = document.createElement('span');
      span.className = 'thumb-ph';
      return span;
    }

    function getCardImageUrl(cardNo) {
      if (!cardNo) return null;
      const parts = cardNo.split('/');
      if (parts.length < 2) return null;
      const set = parts[0].trim();
      let num = parts[1].trim();
      if (!set || !num) return null;
      if (/^\d+$/.test(num)) num = num.padStart(3, '0');
      const setLower = set.toLowerCase().replace(/-/g, '');
      return `https://cf-vanguard.com/wordpress/wp-content/images/cardlist/${set}/${setLower}_${num}.png`;
    }

    function loadRideLines() {
      fetch('./ridelines.csv')
        .then(r => {
          if (!r.ok) throw new Error();
          return r.text();
        })
        .then(text => {
          Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            complete: (res) => {
              buildRideMap(res.data);
              document.getElementById('rideStatus').textContent =
                `ライドラインマッピング読み込み完了（${res.data.length}件）`;
            }
          });
        })
        .catch(() => {
          document.getElementById('rideStatus').textContent = 'ridelines.csv の読み込みに失敗しました';
        });
    }

    function buildRideMap(data) {
      rideMap = {};
      data.forEach(row => {
        const abbr = (row['略称'] || '').trim();
        const full = (row['正式名称'] || '').trim();
        const cardNo = (row['カード番号'] || '').trim();
        if (!abbr && !full) return;
        const img = getCardImageUrl(cardNo); // 番号が空なら null
        const entry = { 正式名称: full, カード番号: cardNo, 画像URL: img };
        if (abbr) rideMap[normKey(abbr)] = entry;
        if (full) rideMap[normKey(full)] = entry;
      });
    }

    function getRideInfo(deckName) {
      return rideMap[normKey(deckName)] || null;
    }

    function toggleAdjustMode() {
      adjustMode = !adjustMode;
      const btn = document.getElementById('adjustModeBtn');
      const hint = document.getElementById('adjustHint');
      btn.textContent = `画像調整モード: ${adjustMode ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', adjustMode);
      hint.style.display = adjustMode ? 'block' : 'none';
      if (chart) {
        chart.options.plugins.tooltip.enabled = !adjustMode;
        chart.update();
      }
    }

    function resetOffsets() {
      imageOffsets = imageOffsets.map(() => ({ dx: 0, dy: 0 }));
      if (chart) chart.update();
    }

    function buildSnsRow(d) {
      const info = getRideInfo(d.name);
      const thumb = (info && info.画像URL)
        ? `<img class="thumb" src="${esc(info.画像URL)}" crossorigin="anonymous" onerror="this.replaceWith(makePlaceholder())">`
        : `<span class="thumb-ph"></span>`;
      return `<div class="sns-row">${thumb}<span>${esc(d.name)}　${d.percent}%（${d.count}人）</span></div>`;
    }

    function processCSV() {
      const file = document.getElementById('csvFile').files[0];
      const columnName = document.getElementById('deckColumn').value.trim();
      if (!file) return alert('CSVを選択してください');

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const counts = {};
          let total = 0;
          results.data.forEach(row => {
            // トナメルCSVの「エントリーキャンセル」は集計から除外
            if ((row['ステータス'] || '').includes('キャンセル')) return;
            const deck = (row[columnName] || '').trim();
            if (deck) {
              counts[deck] = (counts[deck] || 0) + 1;
              total++;
            }
          });
          if (!total) return alert('データが見つかりません。カラム名を確認してください');

          // 使用率の高い順にソート
          sortedData = Object.entries(counts)
            .sort((a, b) => b[1] - a[1])
            .map(([name, count]) => ({
              name,
              count,
              percent: (count / total * 100).toFixed(1)
            }));

          // 箇条書き（高い順）
          document.getElementById('list').innerHTML =
            `<h2>使用率上位（全${total}人）</h2><ul>` +
            sortedData.map(d => `<li><strong>${esc(d.name)}</strong>：${d.count}人（${d.percent}%）</li>`).join('') +
            '</ul>';

          // SNS用テキスト（画像が無い行もグレー枠でそろえる）
          document.getElementById('snsContent').innerHTML =
            `<h3>使用率分布</h3>` +
            sortedData.slice(0, 10).map(buildSnsRow).join('');

          imageOffsets = sortedData.map(() => ({ dx: 0, dy: 0 }));
          createPieChart();
        }
      });
    }

    function createPieChart() {
      if (chart) chart.destroy();

      const labels = sortedData.map(d => d.name);
      const values = sortedData.map(d => d.count);
      const colors = labels.map((_, i) => `hsl(${i * 360 / labels.length}, 70%, 55%)`);

      // 円グラフのcanvasは画像保存しないので crossOrigin は付けない
      // （付けると公式側がCORS非対応の場合に読み込み自体が失敗するため）
      imgElements = sortedData.map(d => {
        const info = getRideInfo(d.name);
        if (!info || !info.画像URL) return null;
        const img = new Image();
        img.onload = () => { if (chart) chart.update('none'); };
        img.src = info.画像URL;
        return img;
      });

      const ctx = document.getElementById('pieChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'right' },
            tooltip: { enabled: !adjustMode }
          }
        },
        plugins: [{
          id: 'imageDrawer',
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const meta = chart.getDatasetMeta(0);

            meta.data.forEach((arc, i) => {
              const img = imgElements[i];
              // 読み込み未完了・失敗（naturalWidth 0）の画像はスキップ
              if (!img || !img.complete || img.naturalWidth === 0) return;

              const midAngle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;
              const radius = (arc.outerRadius + arc.innerRadius) / 2 * 0.65;
              const centerX = chart.chartArea.left + (chart.chartArea.right - chart.chartArea.left) / 2;
              const centerY = chart.chartArea.top + (chart.chartArea.bottom - chart.chartArea.top) / 2;

              let x = centerX + Math.cos(midAngle) * radius;
              let y = centerY + Math.sin(midAngle) * radius;

              x += imageOffsets[i]?.dx || 0;
              y += imageOffsets[i]?.dy || 0;

              const size = 46;
              ctx.save();
              try {
                ctx.drawImage(img, x - size / 2, y - size / 2, size, size * 1.4);
              } catch (e) {
                // 描画に失敗してもグラフ全体は止めない
              }
              ctx.restore();
            });
          }
        }]
      });

      setupDragEvents();
    }

    function setupDragEvents() {
      const canvas = chart.canvas;

      function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function findNearestImage(pos) {
        if (!adjustMode) return null;
        const meta = chart.getDatasetMeta(0);
        let nearest = null;
        let minDist = 50;

        meta.data.forEach((arc, i) => {
          const img = imgElements[i];
          if (!img || img.naturalWidth === 0) return;
          const midAngle = arc.startAngle + (arc.endAngle - arc.startAngle) / 2;
          const radius = (arc.outerRadius + arc.innerRadius) / 2 * 0.65;
          const centerX = chart.chartArea.left + (chart.chartArea.right - chart.chartArea.left) / 2;
          const centerY = chart.chartArea.top + (chart.chartArea.bottom - chart.chartArea.top) / 2;
          let x = centerX + Math.cos(midAngle) * radius + (imageOffsets[i]?.dx || 0);
          let y = centerY + Math.sin(midAngle) * radius + (imageOffsets[i]?.dy || 0);

          const dist = Math.hypot(pos.x - x, pos.y - y);
          if (dist < minDist) {
            minDist = dist;
            nearest = i;
          }
        });
        return nearest;
      }

      function onStart(e) {
        if (!adjustMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const idx = findNearestImage(pos);
        if (idx !== null) {
          dragging = {
            index: idx,
            startX: pos.x,
            startY: pos.y,
            startDx: imageOffsets[idx].dx,
            startDy: imageOffsets[idx].dy
          };
        }
      }

      function onMove(e) {
        if (!dragging || !adjustMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        imageOffsets[dragging.index].dx = dragging.startDx + (pos.x - dragging.startX);
        imageOffsets[dragging.index].dy = dragging.startDy + (pos.y - dragging.startY);
        chart.update('none');
      }

      function onEnd() {
        dragging = null;
      }

      // chartを作り直すたびにcanvasは同じなので、古いリスナーが重複しないよう差し替える
      if (canvas._dragHandlers) {
        const h = canvas._dragHandlers;
        canvas.removeEventListener('mousedown', h.onStart);
        canvas.removeEventListener('mousemove', h.onMove);
        canvas.removeEventListener('mouseup', h.onEnd);
        canvas.removeEventListener('mouseleave', h.onEnd);
        canvas.removeEventListener('touchstart', h.onStart);
        canvas.removeEventListener('touchmove', h.onMove);
        canvas.removeEventListener('touchend', h.onEnd);
      }
      canvas._dragHandlers = { onStart, onMove, onEnd };

      canvas.addEventListener('mousedown', onStart);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onEnd);
      canvas.addEventListener('mouseleave', onEnd);
      canvas.addEventListener('touchstart', onStart, { passive: false });
      canvas.addEventListener('touchmove', onMove, { passive: false });
      canvas.addEventListener('touchend', onEnd);
    }

    function downloadSNSImage() {
      const el = document.getElementById('snsCapture');
      html2canvas(el, { scale: 2, useCORS: true, allowTaint: false }).then(canvas => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'deck_usage_sns.png';
        a.click();
      });
    }

    // ページ読み込み時に自動でマッピングを読み込む
    window.addEventListener('load', () => {
      loadRideLines();
    });
  </script>
</body>
</html>
